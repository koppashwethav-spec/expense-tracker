<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
        h1 { color: #333; text-align: center; }
        .form-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #4CAF50; color: white; }
        .delete-btn { background: red; padding: 5px 10px; width: auto; }
    </style>
</head>
<body>

    <h1>💰 Expense Tracker</h1>

    <!-- Add Expense Form -->
    <div class="form-box">
        <h2>Add Expense</h2>
        <input type="text" id="category" placeholder="Category (Food, Travel, etc.)">
        <input type="number" id="amount" placeholder="Amount (₹)">
        <input type="text" id="description" placeholder="Description">
        <input type="date" id="date">
        <button onclick="addExpense()">Add Expense</button>
    </div>

    <!-- Expense List -->
    <h2>All Expenses</h2>
    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="expenseList"></tbody>
    </table>

    <script>
        const API = 'http://localhost:8081/api/expenses';

        // Load all expenses
        function loadExpenses() {
            fetch(API)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('expenseList');
                    list.innerHTML = '';
                    data.forEach(exp => {
                        list.innerHTML += `
                            <tr>
                                <td>${exp.category}</td>
                                <td>₹${exp.amount}</td>
                                <td>${exp.description}</td>
                                <td>${exp.date}</td>
                                <td><button class="delete-btn" onclick="deleteExpense(${exp.id})">Delete</button></td>
                            </tr>`;
                    });
                });
        }

        // Add expense
        function addExpense() {
            const expense = {
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value,
                description: document.getElementById('description').value,
                date: document.getElementById('date').value
            };

            fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expense)
            }).then(() => {
                loadExpenses();
            });
        }

        // Delete expense
        function deleteExpense(id) {
            fetch(API + '/' + id, { method: 'DELETE' })
                .then(() => loadExpenses());
        }

        // Load on page start
        loadExpenses();
    </script>

</body>
</html>
