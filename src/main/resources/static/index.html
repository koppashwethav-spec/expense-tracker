<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #667eea; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; }
        .logout-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 10px; }
        .stat-card p { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card.green p { color: #4CAF50; }
        .stat-card.red p { color: #f44336; }
        .stat-card.blue p { color: #2196F3; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .form-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); height: fit-content; }
        .form-card h2 { color: #333; margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #666; font-size: 13px; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #667eea; outline: none; }
        .save-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .table-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .filter-group { display: flex; gap: 10px; }
        .filter-group input, .filter-group select { padding: 8px 12px; border: 2px solid #eee; border-radius: 8px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; color: #666; font-size: 13px; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #f8f9fa; }
        .category-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .Food { background: #fff3e0; color: #ff9800; }
        .Travel { background: #e3f2fd; color: #2196F3; }
        .Shopping { background: #fce4ec; color: #e91e63; }
        .Bills { background: #f3e5f5; color: #9c27b0; }
        .Other { background: #e8f5e9; color: #4CAF50; }
        .edit-btn { background: #ff9800; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; font-size: 12px; }
        .delete-btn { background: #f44336; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .pdf-btn { background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .excel-btn { background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .user-name { font-weight: bold; }
        .dark-toggle { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-right: 10px; }
        /* Dark Mode */
        body.dark { background: #1a1a2e; }
        body.dark .form-card, body.dark .table-card, body.dark .stat-card { background: #16213e; color: white; }
        body.dark .form-card h2, body.dark table, body.dark td { color: white; }
        body.dark th { background: #0f3460; color: white; }
        body.dark .form-group input, body.dark .form-group select, body.dark .filter-group input, body.dark .filter-group select { background: #0f3460; color: white; border-color: #444; }
        body.dark tr:hover { background: #0f3460; }
        body.dark td { border-bottom-color: #333; }
        /* Mobile Friendly */
        @media (max-width: 768px) {
            .stats { grid-template-columns: 1fr; }
            .main-grid { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
            .header { padding: 15px; flex-direction: column; gap: 10px; text-align: center; }
            .table-header { flex-direction: column; gap: 10px; }
            .filter-group { flex-direction: column; }
            .container { padding: 0 10px; }
            table { font-size: 12px; }
            th, td { padding: 8px 5px; }
            .edit-btn, .delete-btn { padding: 3px 8px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>💰 Expense Tracker</h1>
        <div>
            <button class="dark-toggle" onclick="toggleDark()">🌙 Dark Mode</button>
            <span class="user-name" id="userName">Welcome!</span>
            <button class="logout-btn" onclick="logout()" style="margin-left:15px">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <div class="container">

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card green">
                <h3>💰 Total Spent</h3>
                <p>₹<span id="totalAmount">0</span></p>
            </div>
            <div class="stat-card blue">
                <h3>📋 Total Expenses</h3>
                <p><span id="totalCount">0</span></p>
            </div>
            <div class="stat-card red">
                <h3>📅 This Month</h3>
                <p>₹<span id="monthAmount">0</span></p>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="form-card">
                <h2>📊 Spending by Category</h2>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="form-card">
                <h2>📅 Monthly Spending</h2>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">

            <!-- Add/Edit Form -->
            <div class="form-card">
                <h2 id="formTitle">➕ Add Expense</h2>
                <input type="hidden" id="expenseId">
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="Food">🍔 Food</option>
                        <option value="Travel">✈️ Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="description" placeholder="What did you spend on?">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date">
                </div>
                <div class="form-group">
                    <label>💰 Monthly Budget (₹)</label>
                    <input type="number" id="budget" placeholder="Set budget limit">
                    <button onclick="saveBudget()" style="margin-top:8px;width:100%;padding:8px;background:#4CAF50;color:white;border:none;border-radius:8px;cursor:pointer;">Set Budget</button>
                </div>
                <button class="save-btn" onclick="saveExpense()">Save Expense</button>
            </div>

            <!-- Expense Table -->
            <div class="table-card">
                <div class="table-header">
                    <h2>📋 All Expenses</h2>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button class="pdf-btn" onclick="exportPDF()">📄 PDF</button>
                        <button class="excel-btn" onclick="exportExcel()">📊 Excel</button>
                    </div>
                    <div class="filter-group">
                        <select id="filterCategory" onchange="filterExpenses()">
                            <option value="">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="text" id="filterSearch" placeholder="🔍 Search..." onkeyup="filterExpenses()">
                    </div>
                </div>

                <!-- Budget Warning -->
                <div id="budgetWarning" style="display:none;background:#fff3e0;border-left:4px solid #ff9800;padding:10px;margin-bottom:15px;border-radius:4px;">
                    ⚠️ <span id="budgetMessage"></span>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const API = 'http://localhost:8081/api/expenses';
        let allExpenses = [];

        // Show username
        const userName = localStorage.getItem('userName');
        if (userName) document.getElementById('userName').innerText = `Hi, ${userName}!`;

        // Dark Mode
        function toggleDark() {
            document.body.classList.toggle('dark');
            const btn = document.querySelector('.dark-toggle');
            btn.innerText = document.body.classList.contains('dark') ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem('darkMode', document.body.classList.contains('dark'));
        }
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            document.querySelector('.dark-toggle').innerText = '☀️ Light Mode';
        }

        // Budget
        function saveBudget() {
            const budget = document.getElementById('budget').value;
            if (budget) {
                localStorage.setItem('budget', budget);
                alert('Budget set to ₹' + budget + '!');
            }
        }

        function checkBudget(total) {
            const budget = localStorage.getItem('budget');
            if (budget) {
                document.getElementById('budget').value = budget;
                const warning = document.getElementById('budgetWarning');
                const message = document.getElementById('budgetMessage');
                if (total >= budget) {
                    warning.style.display = 'block';
                    warning.style.borderColor = '#f44336';
                    warning.style.background = '#ffebee';
                    message.innerText = `🚨 Budget exceeded! Spent ₹${total} of ₹${budget} budget!`;
                } else if (total >= budget * 0.8) {
                    warning.style.display = 'block';
                    message.innerText = `⚠️ Warning! Spent ₹${total} of ₹${budget} budget (${Math.round(total/budget*100)}%)`;
                } else {
                    warning.style.display = 'none';
                }
            }
        }

        // Logout
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Load expenses
        function loadExpenses() {
            fetch(API)
                .then(res => res.json())
                .then(data => {
                    allExpenses = data;
                    displayExpenses(data);
                    updateStats(data);
                    renderCategoryChart(data);
                    renderMonthlyChart(data);
                });
        }

        // Display expenses
        function displayExpenses(data) {
            const list = document.getElementById('expenseList');
            list.innerHTML = '';
            if (data.length === 0) {
                list.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:30px">No expenses found!</td></tr>';
                return;
            }
            data.forEach(exp => {
                list.innerHTML += `
                    <tr>
                        <td><span class="category-badge ${exp.category}">${exp.category}</span></td>
                        <td><strong>₹${exp.amount}</strong></td>
                        <td>${exp.description}</td>
                        <td>${exp.date}</td>
                        <td>
                            <button class="edit-btn" onclick="editExpense(${exp.id},'${exp.category}',${exp.amount},'${exp.description}','${exp.date}')">✏️ Edit</button>
                            <button class="delete-btn" onclick="deleteExpense(${exp.id})">🗑️ Delete</button>
                        </td>
                    </tr>`;
            });
        }

        // Update stats
        function updateStats(data) {
            const total = data.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('totalAmount').innerText = total.toFixed(2);
            document.getElementById('totalCount').innerText = data.length;
            const thisMonth = new Date().getMonth();
            const monthTotal = data
                .filter(e => new Date(e.date).getMonth() === thisMonth)
                .reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('monthAmount').innerText = monthTotal.toFixed(2);
            checkBudget(total);
        }

        // Filter
        function filterExpenses() {
            const category = document.getElementById('filterCategory').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            let filtered = allExpenses;
            if (category) filtered = filtered.filter(e => e.category === category);
            if (search) filtered = filtered.filter(e => e.description.toLowerCase().includes(search));
            displayExpenses(filtered);
        }

        // Save expense
        function saveExpense() {
            const id = document.getElementById('expenseId').value;
            const expense = {
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value,
                description: document.getElementById('description').value,
                date: document.getElementById('date').value
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API}/${id}` : API;
            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expense)
            }).then(() => { clearForm(); loadExpenses(); });
        }

        // Edit
        function editExpense(id, category, amount, description, date) {
            document.getElementById('expenseId').value = id;
            document.getElementById('category').value = category;
            document.getElementById('amount').value = amount;
            document.getElementById('description').value = description;
            document.getElementById('date').value = date;
            document.getElementById('formTitle').innerText = '✏️ Edit Expense';
        }

        // Delete
        function deleteExpense(id) {
            if (confirm('Delete this expense?')) {
                fetch(`${API}/${id}`, { method: 'DELETE' })
                    .then(() => loadExpenses());
            }
        }

        // Clear form
        function clearForm() {
            document.getElementById('expenseId').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
            document.getElementById('date').value = '';
            document.getElementById('formTitle').innerText = '➕ Add Expense';
        }

        // Export PDF
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('Expense Tracker Report', 14, 15);
            doc.autoTable({
                head: [['Category', 'Amount', 'Description', 'Date']],
                body: allExpenses.map(e => [e.category, '₹' + e.amount, e.description, e.date]),
                startY: 25
            });
            doc.save('expenses.pdf');
        }

        // Export Excel
        function exportExcel() {
            const data = allExpenses.map(e => ({
                Category: e.category,
                Amount: e.amount,
                Description: e.description,
                Date: e.date
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Expenses');
            XLSX.writeFile(wb, 'expenses.xlsx');
        }

        // Category Chart
        function renderCategoryChart(data) {
            const categories = {};
            data.forEach(e => {
                categories[e.category] = (categories[e.category] || 0) + e.amount;
            });
            const ctx = document.getElementById('categoryChart').getContext('2d');
            if (window.categoryChartInstance) window.categoryChartInstance.destroy();
            window.categoryChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categories),
                    datasets: [{
                        data: Object.values(categories),
                        backgroundColor: ['#ff9800', '#2196F3', '#e91e63', '#9c27b0', '#4CAF50']
                    }]
                },
                options: { responsive: true }
            });
        }

        // Monthly Chart
        function renderMonthlyChart(data) {
            const months = {};
            data.forEach(e => {
                const month = new Date(e.date).toLocaleString('default', { month: 'short' });
                months[month] = (months[month] || 0) + e.amount;
            });
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if (window.monthlyChartInstance) window.monthlyChartInstance.destroy();
            window.monthlyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(months),
                    datasets: [{
                        label: 'Amount (₹)',
                        data: Object.values(months),
                        backgroundColor: '#667eea'
                    }]
                },
                options: { responsive: true }
            });
        }

        loadExpenses();
    </script>

</body>
</html>
