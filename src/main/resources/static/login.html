<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 16px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .logo { text-align: center; font-size: 40px; margin-bottom: 10px; }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #666; font-size: 13px; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #667eea; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: #f5f5f5; color: #333; margin-top: 10px; }
        .btn-link { background: none; color: #667eea; font-size: 13px; cursor: pointer; border: none; width: 100%; text-align: center; margin-top: 10px; text-decoration: underline; }
        .message { text-align: center; margin-top: 10px; font-size: 14px; padding: 8px; border-radius: 6px; }
        .message.error { background: #ffebee; color: #f44336; }
        .message.success { background: #e8f5e9; color: #4CAF50; }
        .divider { text-align: center; color: #999; margin: 15px 0; font-size: 13px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">💰</div>
        <h2 id="formTitle">Welcome Back!</h2>
        <p class="subtitle" id="formSubtitle">Login to your account</p>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn btn-primary" onclick="login()">Login</button>
            <button class="btn btn-link" onclick="showForgot()">Forgot Password?</button>
            <div class="divider">Don't have an account?</div>
            <button class="btn btn-secondary" onclick="showRegister()">Create Account</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display:none">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create a password">
            </div>
            <button class="btn btn-primary" onclick="register()">Create Account</button>
            <div class="divider">Already have an account?</div>
            <button class="btn btn-secondary" onclick="showLogin()">Back to Login</button>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgotForm" style="display:none">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="forgotEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <button class="btn btn-primary" onclick="resetPassword()">Reset Password</button>
            <div class="divider">Remember your password?</div>
            <button class="btn btn-secondary" onclick="showLogin()">Back to Login</button>
        </div>

        <p class="message" id="message" style="display:none"></p>
    </div>

    <script>
        const API = 'http://localhost:8081/api/auth';

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('formTitle').innerText = 'Welcome Back!';
            document.getElementById('formSubtitle').innerText = 'Login to your account';
            hideMessage();
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('formTitle').innerText = 'Create Account';
            document.getElementById('formSubtitle').innerText = 'Join Expense Tracker today';
            hideMessage();
        }

        function showForgot() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
            document.getElementById('formTitle').innerText = 'Reset Password';
            document.getElementById('formSubtitle').innerText = 'Enter your email to reset password';
            hideMessage();
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerText = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showMessage('Please fill all fields!', 'error'); return; }
            fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message === 'Login successful!') {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userName', data.name);
                    window.location.href = 'index.html';
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(err => showMessage('Connection error! Is server running?', 'error'));
        }

        function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            if (!name || !email || !password) { showMessage('Please fill all fields!', 'error'); return; }
            fetch(`${API}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message === 'Registration successful!') {
                    showMessage('Account created! Please login.', 'success');
                    setTimeout(() => showLogin(), 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(err => showMessage('Connection error! Is server running?', 'error'));
        }

        function resetPassword() {
            const email = document.getElementById('forgotEmail').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!email || !newPassword || !confirmPassword) { showMessage('Please fill all fields!', 'error'); return; }
            if (newPassword !== confirmPassword) { showMessage('Passwords do not match!', 'error'); return; }
            fetch(`${API}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: newPassword })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message === 'Password reset successful!') {
                    showMessage('Password reset! Please login.', 'success');
                    setTimeout(() => showLogin(), 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(err => showMessage('Connection error! Is server running?', 'error'));
        }
    </script>
</body>
</html>
